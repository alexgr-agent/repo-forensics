name: Self-scan

# repo-forensics scans its own code on every push and pull request. A security
# scanner always flags itself (it holds the patterns it hunts for), so the
# reviewed findings live in .github/selfscan-baseline.json and this job fails
# only on something new at medium severity or above.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: self-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Scan our own code against the known list
        env:
          PYTHONUTF8: "1"
        run: python3 scripts/selfscan_gate.py
